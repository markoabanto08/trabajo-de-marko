<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iniciar Sesión - Sistema de Reclamos</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(135deg, #ff0055, #ff8c00);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    /* Botón Volver */
    .volver {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(255,255,255,0.2);
      color: white;
      padding: 8px 15px;
      border-radius: 25px;
      text-decoration: none;
      font-weight: bold;
      backdrop-filter: blur(6px);
      transition: background 0.3s, transform 0.2s;
    }
    .volver:hover {
      background: rgba(255,255,255,0.4);
      transform: scale(1.05);
    }

    /* Tarjeta de Login */
    .login-card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
      padding: 30px 35px;
      text-align: center;
      width: 100%;
      max-width: 400px;
      color: white;
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-card h1 {
      font-size: 1.8rem;
      margin-bottom: 10px;
      color: #ffd700;
    }

    .login-card p {
      font-size: 0.9rem;
      margin-bottom: 20px;
      color: #eee;
    }

    /* Campos */
    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }
    .form-group label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 5px;
    }
    .form-group input,
    .form-group select {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: rgba(255,255,255,0.2);
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: background 0.3s;
    }
    .form-group input:focus,
    .form-group select:focus {
      background: rgba(255,255,255,0.3);
    }

    /* Botón */
    .login-btn {
      width: 100%;
      padding: 12px;
      background: #ffd700;
      color: #000;
      font-weight: bold;
      font-size: 1rem;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }
    .login-btn:hover {
      background: #fff;
      transform: scale(1.05);
    }

    /* Mensaje de error */
    .error-msg {
      color: #ff7b7b;
      text-align: center;
      margin-top: 10px;
      font-size: 0.9rem;
      display: none;
    }

    /* Enlaces */
    .extra-links {
      margin-top: 15px;
      font-size: 0.85rem;
    }
    .extra-links a {
      color: #ffd700;
      text-decoration: none;
      margin: 0 5px;
    }
    .extra-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <a href="index.html" class="volver">⬅️ Volver</a>

  <div class="login-card">
    <h1>Acceso al Sistema</h1>
    <p>Inicia sesión para continuar</p>

    <form id="login-form">
      <div class="form-group">
        <label for="email">📧 Correo Electrónico</label>
        <input type="email" id="email" placeholder="usuario@correo.com" required>
      </div>

      <div class="form-group">
        <label for="password">🔒 Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <div class="form-group">
        <label for="role">👤 Tipo de Usuario</label>
        <select id="role" required>
          <option value="">Seleccione...</option>
          <option value="ciudadano">Ciudadano</option>
          <option value="autoridad">Autoridad</option>
          <option value="admin">Administrador</option>
        </select>
      </div>

      <button type="submit" class="login-btn">🚪 Ingresar</button>
      <div class="error-msg" id="error-msg">❌ Correo, contraseña o rol incorrectos</div>
    </form>

    <div class="extra-links">
      <a href="recuperar.html">¿Olvidaste tu contraseña?</a> |
      <a href="register.html">Crear cuenta nueva</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errorMsg = document.getElementById('error-msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const role = document.getElementById('role').value;

      if (!email || !password || !role) {
        errorMsg.textContent = "⚠️ Por favor, completa todos los campos.";
        errorMsg.style.display = "block";
        return;
      }

      try {
        const res = await fetch('php/login.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ email, password, role })
        });

        const data = await res.json();

        if (data.success) {
          localStorage.setItem('loggedUser', JSON.stringify({ email, role }));

          // Redirección según rol
          window.location.href =
            role === 'ciudadano' ? 'panel-ciudadano.html' :
            role === 'autoridad' ? 'panel-autoridad.html' :
            'panel-admin.html';
        } else {
          errorMsg.textContent = "❌ " + data.message;
          errorMsg.style.display = "block";
        }
      } catch (err) {
        errorMsg.textContent = "⚠️ Error de conexión con el servidor.";
        errorMsg.style.display = "block";
      }
    });
  </script>

</body>
</html>
