<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registro - Sistema de Reclamos</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(135deg, #ff0055, #ff8c00);
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      overflow:hidden;
    }

    .volver {
      position:absolute;
      top:20px; left:20px;
      background: rgba(255,255,255,0.2);
      color:white;
      padding:8px 15px;
      border-radius:25px;
      text-decoration:none;
      font-weight:bold;
      backdrop-filter: blur(6px);
      transition: background 0.3s, transform 0.2s;
    }
    .volver:hover { background: rgba(255,255,255,0.4); transform:scale(1.05); }

    .register-card {
      background: rgba(0,0,0,0.75);
      padding: 30px 35px;
      border-radius: 20px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.5);
      text-align:center;
      width:100%;
      max-width:420px;
      color:white;
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn { 
      from{opacity:0; transform:translateY(-30px);} 
      to{opacity:1; transform:translateY(0);} 
    }

    .register-card h1 { font-size:1.8rem; margin-bottom:10px; color:#ffd700; }
    .register-card p { font-size:0.9rem; margin-bottom:20px; color:#ddd; }

    .form-group { margin-bottom:15px; text-align:left; }
    .form-group label { display:block; font-size:0.9rem; margin-bottom:5px; }
    .form-group input, .form-group select {
      width:100%; padding:10px; border:none; border-radius:8px;
      background: rgba(255,255,255,0.1); color:#fff; font-size:1rem;
      outline:none; transition: background 0.3s;
    }
    .form-group input:focus, .form-group select:focus { background: rgba(255,255,255,0.2); }

    .register-btn {
      width:100%; padding:12px; background:#ffd700; color:#000;
      font-weight:bold; font-size:1rem; border:none; border-radius:25px;
      cursor:pointer; transition: background 0.3s, transform 0.2s;
    }
    .register-btn:hover { background:#fff; transform:scale(1.05); }

    .error-msg { color:#ff7b7b; text-align:center; margin-top:10px; font-size:0.9rem; display:none; }
    .success-msg { color:#9ef09e; text-align:center; margin-top:10px; font-size:0.95rem; display:none; }

    .extra-links { margin-top:15px; font-size:0.85rem; }
    .extra-links a { color:#ffd700; text-decoration:none; margin:0 5px; }
    .extra-links a:hover { text-decoration:underline; }
  </style>
</head>

<body>
  <a href="login.html" class="volver">⬅️ Volver</a>

  <div class="register-card">
    <h1>Crear Cuenta</h1>
    <p>Regístrate para usar el sistema</p>

    <form id="registerForm" autocomplete="off">
      <div class="form-group">
        <label for="nombre">👤 Nombre completo</label>
        <input type="text" id="nombre" placeholder="Tu nombre completo" required>
      </div>

      <div class="form-group">
        <label for="email">📧 Correo Electrónico</label>
        <input type="email" id="email" placeholder="usuario@correo.com" required>
      </div>

      <div class="form-group">
        <label for="password">🔒 Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <div class="form-group">
        <label for="password2">🔒 Confirmar Contraseña</label>
        <input type="password" id="password2" placeholder="••••••••" required>
      </div>

      <div class="form-group">
        <label for="rol">👤 Tipo de Usuario</label>
        <select id="rol" required>
          <option value="">Seleccione...</option>
          <option value="ciudadano">Ciudadano</option>
          <option value="autoridad">Autoridad</option>
          <option value="admin">Administrador</option>
        </select>
      </div>

      <button type="submit" class="register-btn">Crear Cuenta</button>
      <div class="error-msg" id="error-msg"></div>
      <div class="success-msg" id="success-msg"></div>
    </form>

    <div class="extra-links">
      <a href="login.html">¿Ya tienes cuenta? Inicia sesión</a>
    </div>
  </div>

  <script>
    const registerForm = document.getElementById('registerForm');
    const errorMsg = document.getElementById('error-msg');
    const successMsg = document.getElementById('success-msg');

    function showMessage(el, msg, color = "error") {
      errorMsg.style.display = "none";
      successMsg.style.display = "none";
      el.textContent = msg;
      el.style.display = "block";
    }

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const nombre = document.getElementById('nombre').value.trim();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;
      const rol = document.getElementById('rol').value;

      if (!nombre || !email || !password || !password2 || !rol) {
        showMessage(errorMsg, "⚠️ Completa todos los campos.");
        return;
      }

      if (password.length < 6) {
        showMessage(errorMsg, "⚠️ La contraseña debe tener al menos 6 caracteres.");
        return;
      }

      if (password !== password2) {
        showMessage(errorMsg, "⚠️ Las contraseñas no coinciden.");
        return;
      }

      try {
        const res = await fetch("php/register.php", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams({ nombre, email, password, rol })
        });

        const data = await res.json();

        if (data.success) {
          showMessage(successMsg, "✅ " + data.message);
          setTimeout(() => window.location.href = "login.html", 1500);
        } else {
          showMessage(errorMsg, "❌ " + data.message);
        }
      } catch (err) {
        showMessage(errorMsg, "⚠️ Error de conexión con el servidor.");
      }
    });
  </script>
</body>
</html>
