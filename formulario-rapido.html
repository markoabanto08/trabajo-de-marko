<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Formulario Rápido - Reclamos Ciudadanos</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(135deg, #ff0055, #ff8c00);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    header {
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(6px);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.3rem;
      font-weight: bold;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      margin-left: 20px;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #ffd700;
    }

    /* FORMULARIO */
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 10px;
    }

    .form-container {
      background: rgba(0, 0, 0, 0.5);
      padding: 25px;
      border-radius: 15px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 5px 20px rgba(0,0,0,0.3);
    }

    .form-container h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #ffd700;
      font-size: 1.8rem;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: 600;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      margin-top: 5px;
      font-size: 1rem;
    }

    textarea {
      resize: vertical;
    }

    button {
      width: 100%;
      background: #ffd700;
      color: #000;
      padding: 12px;
      border: none;
      border-radius: 25px;
      margin-top: 20px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.3s, transform 0.2s;
    }

    button:hover {
      background: #fff;
      transform: scale(1.05);
    }

    .mensaje-exito {
      text-align: center;
      margin-top: 15px;
      background: rgba(0, 255, 100, 0.2);
      border: 1px solid #00ff66;
      padding: 10px;
      border-radius: 8px;
      display: none;
    }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 15px;
      background: #000;
      font-size: 0.9rem;
      border-top: 2px solid #ff0055;
    }
  </style>
</head>

<body>
  <!-- HEADER -->
  <header>
    <div class="logo">📢 Reclamos Ciudadanos</div>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="login.html">Iniciar Sesión</a>
    </nav>
  </header>

  <!-- FORMULARIO -->
  <main>
    <div class="form-container">
      <h1>📝 Formulario Rápido</h1>
      <p style="text-align:center; font-size:0.9rem; opacity:0.9;">
        Envía un reclamo básico sin registrarte. Será verificado por la municipalidad.
      </p>

      <form id="form-rapido">
        <label for="nombre">Tu nombre (opcional):</label>
        <input type="text" id="nombre" placeholder="Ej. Juan Pérez">

        <label for="tipo">Tipo de problema:</label>
        <select id="tipo" required>
          <option value="">Seleccione...</option>
          <option value="bache">🚧 Bache en la vía</option>
          <option value="alumbrado">💡 Alumbrado público</option>
          <option value="limpieza">🧹 Limpieza pública</option>
          <option value="otro">📝 Otro</option>
        </select>

        <label for="descripcion">Descripción:</label>
        <textarea id="descripcion" rows="3" placeholder="Describe el problema..." required></textarea>

        <label for="ubicacion">Ubicación aproximada:</label>
        <input type="text" id="ubicacion" placeholder="Ej: Av. Principal 123 - Guadalupe" required>

        <label for="foto">Adjuntar foto (opcional):</label>
        <input type="file" id="foto" accept="image/*">

        <button type="submit">📨 Enviar Reclamo</button>
      </form>

      <div class="mensaje-exito" id="mensajeExito">
        ✅ ¡Tu reclamo ha sido enviado correctamente!
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    © 2025 Municipalidad de Guadalupe — Sistema de Reclamos
  </footer>

  <script>
    const form = document.getElementById('form-rapido');
    const mensaje = document.getElementById('mensajeExito');

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const nuevoReclamo = {
        id: Date.now(),
        nombre: document.getElementById('nombre').value || 'Anónimo',
        tipo: document.getElementById('tipo').value,
        descripcion: document.getElementById('descripcion').value,
        ubicacion: document.getElementById('ubicacion').value,
        fecha: new Date().toLocaleString(),
        estado: 'Por verificar'
      };

      // Guardar en localStorage
      const reclamosRapidos = JSON.parse(localStorage.getItem('reclamosRapidos')) || [];
      reclamosRapidos.push(nuevoReclamo);
      localStorage.setItem('reclamosRapidos', JSON.stringify(reclamosRapidos));

      form.reset();
      mensaje.style.display = 'block';

      setTimeout(() => mensaje.style.display = 'none', 4000);
    });
  </script>
</body>
</html>
